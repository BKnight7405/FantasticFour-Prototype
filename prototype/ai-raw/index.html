<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CUSports — Clemson Sports Products</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="#/home"><span class="paw" aria-hidden="true">🐾</span>CUSports</a>

    <form id="search-form" role="search">
      <label for="search-input">Search products</label>
      <input type="search" id="search-input" name="q" placeholder="e.g. jersey, cap, basketball" autocomplete="off" />
      <button type="submit">Search</button>
    </form>

    <nav class="primary-nav" aria-label="Primary">
      <a href="#/home">Home</a>
      <a href="#/cart">Cart (<span id="cart-count">0</span>)</a>
      <a href="#/orders">My Orders</a>
    </nav>

    <div class="account-switcher">
      <label for="customer-select">Signed in as</label>
      <select id="customer-select"></select>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <div id="app"><!-- Screens are rendered here by app.js --></div>
</main>

<footer>
  <p>CUSports prototype — synthetic data only. Not a real store; no payments are processed or transmitted.</p>
</footer>

<div id="live-region" class="visually-hidden" aria-live="polite" role="status"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
